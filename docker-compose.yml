services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sportsbook
      POSTGRES_USER: sportsbook
      POSTGRES_PASSWORD: sportsbook
    ports:
      - "5437:5432" # host port for local `go test`; the API uses the service network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsbook -d sportsbook"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://sportsbook:sportsbook@db:5432/sportsbook?sslmode=disable
      PORT: "8080"
      LINE_TICK_MS: "3000"
      MARGIN_BPS: "500"
      LINE_SEED: "7"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
